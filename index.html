<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Interactive Tour - Urban Longevity Lab (Via dei Crispolti 26)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #121212;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            background: rgba(26, 32, 44, 0.85);
            backdrop-filter: blur(12px);
            padding: 18px 24px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.12);
            max-width: 340px;
            pointer-events: auto;
        }
        h1 {
            font-size: 17px;
            margin: 0 0 6px 0;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #E2DDD5;
        }
        p {
            font-size: 12px;
            margin: 0 0 14px 0;
            color: #A0AEC0;
            line-height: 1.4;
        }
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        button {
            background: #2D3748;
            color: #E2E8F0;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        button:hover {
            background: #4A5568;
            color: #ffffff;
            transform: translateY(-1px);
        }
        button.active {
            background: #C4A47C;
            color: #1A202C;
            border-color: #C4A47C;
        }
        #legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(26, 32, 44, 0.85);
            backdrop-filter: blur(12px);
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.12);
            color: #E2E8F0;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 3px;
        }
    </style>
    <!-- Three.js & OrbitControls via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="ui-overlay">
        <h1>URBAN LONGEVITY LAB</h1>
        <p>Concept Store Quiet Luxury (On-Budget) • Via dei Crispolti 26, Roma</p>
        <div class="btn-group">
            <button onclick="setView('top')">Vista Pianta</button>
            <button onclick="setView('iso')" class="active">Vista Assonometrica</button>
            <button onclick="setView('entrance')">Ingresso / Vetrina</button>
            <button onclick="setView('cabin')">Cabina High-Tech</button>
        </div>
    </div>

    <div id="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#E3DDD3;"></div>Microcemento Sabbia Greige</div>
        <div class="legend-item"><div class="legend-dot" style="background:#C4A47C;"></div>Rovere Naturale Nordico</div>
        <div class="legend-item"><div class="legend-dot" style="background:#1B365D;"></div>Metallo Canna di Fucile / Tech</div>
        <div class="legend-item"><div class="legend-dot" style="background:#4A777A;"></div>Accenti Tessili Salvia / Bouclé</div>
    </div>

    <div id="canvas-container"></div>

    <script>
        // Inizializzazione Scena
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xF0ECE1);
        scene.fog = new THREE.FogExp2(0xF0ECE1, 0.025);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2.05;
        controls.minDistance = 2;
        controls.maxDistance = 25;

        // Luci architetturali
        const ambientLight = new THREE.AmbientLight(0xFFFBF5, 0.75);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xFFF3E0, 1.2);
        sunLight.position.set(5, 12, -4);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.bias = -0.0005;
        scene.add(sunLight);

        const warmSpot = new THREE.PointLight(0xFFD8A8, 0.9, 10);
        warmSpot.position.set(2.2, 2.9, 2);
        scene.add(warmSpot);

        // Materiali del concept materico Quiet Luxury
        const matFloor = new THREE.MeshStandardMaterial({ color: 0xE3DDD3, roughness: 0.65, metalness: 0.05 });
        const matWall = new THREE.MeshStandardMaterial({ color: 0xECE6DC, roughness: 0.9, metalness: 0.0 });
        const matWallGlass = new THREE.MeshPhysicalMaterial({ color: 0xD0E0E3, transparent: true, opacity: 0.35, roughness: 0.1, transmission: 0.8 });
        const matWood = new THREE.MeshStandardMaterial({ color: 0xC4A47C, roughness: 0.5, metalness: 0.05 });
        const matMetal = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.3, metalness: 0.8 });
        const matFabric = new THREE.MeshStandardMaterial({ color: 0xF5F2EB, roughness: 0.95 });
        const matSageFabric = new THREE.MeshStandardMaterial({ color: 0x6E857C, roughness: 0.9 });
        const matMirror = new THREE.MeshStandardMaterial({ color: 0xFFFFFF, roughness: 0.0, metalness: 0.95 });

        function createBox(w, h, d, mat, x, y, z, rx=0, ry=0, rz=0) {
            const geom = new THREE.BoxGeometry(w, h, d);
            const mesh = new THREE.Mesh(geom, mat);
            mesh.position.set(x, y, z);
            mesh.rotation.set(rx, ry, rz);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            return mesh;
        }

        // Pavimento microcemento continuo (4.5m x 7.8m)
        createBox(4.5, 0.1, 7.8, matFloor, 0, -0.05, 0);

        // Muri perimetrali dello spaccato
        createBox(4.5, 3.0, 0.15, matWall, 0, 1.5, 3.9);
        createBox(0.15, 3.0, 7.8, matWall, -2.25, 1.5, 0);

        // Vetrina e infisso canna di fucile
        createBox(3.2, 0.08, 0.08, matMetal, -0.65, 0.04, -3.9);
        createBox(3.0, 2.8, 0.04, matWallGlass, -0.75, 1.4, -3.9);
        createBox(0.95, 2.7, 0.05, matWallGlass, 1.7, 1.35, -3.85, 0, 0.35, 0);
        createBox(0.04, 2.7, 0.08, matMetal, 1.7, 1.35, -3.85, 0, 0.35, 0);

        // Bagno clienti & antibagno sopra la colonna
        createBox(0.1, 2.6, 3.2, matWall, -2.25 + 1.4, 1.3, -3.9 + 1.6);
        createBox(1.4, 2.6, 0.1, matWall, -2.25 + 0.7, 1.3, -3.9 + 3.2);
        createBox(0.05, 2.2, 0.85, matWood, -2.25 + 1.4, 1.1, -3.9 + 2.4);
        createBox(0.38, 0.42, 0.5, matFabric, -2.25 + 0.7, 0.21, -3.9 + 0.6);
        createBox(0.6, 0.06, 0.4, matWood, -2.25 + 0.7, 0.85, -3.9 + 2.2);
        createBox(0.4, 0.15, 0.3, matFabric, -2.25 + 0.7, 0.95, -3.9 + 2.2);
        createBox(0.02, 0.8, 0.5, matMirror, -2.25 + 0.7, 1.5, -3.9 + 2.0);

        // Scala discendente al piano S1 con parapetto
        for (let i = 0; i < 9; i++) {
            const sZ = 3.9 - 0.5 - (i * 0.35);
            const sY = - (i * 0.14);
            createBox(1.05, 0.14, 0.35, matFloor, -2.25 + 0.6, sY, sZ);
        }
        createBox(0.04, 0.95, 3.4, matMetal, -2.25 + 1.15, 0.47, 3.9 - 1.9);

        // Cabina 1 al piano terra con lavabo interno ASL
        createBox(0.1, 2.7, 4.1, matWall, -2.25 + 2.3, 1.35, 3.9 - 2.05);
        createBox(2.2, 2.7, 0.1, matWall, -2.25 + 3.4, 1.35, 3.9 - 4.1);
        createBox(0.9, 2.3, 0.04, matWood, -2.25 + 2.9, 1.15, 3.9 - 4.15);
        createBox(0.8, 0.35, 2.0, matWood, -2.25 + 3.4, 0.17, 3.9 - 1.8);
        createBox(0.85, 0.3, 2.05, matFabric, -2.25 + 3.4, 0.45, 3.9 - 1.8);
        createBox(0.45, 1.15, 0.45, matMetal, -2.25 + 4.0, 0.57, 3.9 - 0.5);
        createBox(0.3, 0.2, 0.05, matWood, -2.25 + 4.0, 1.1, 3.9 - 0.5, -0.3, 0, 0);
        createBox(0.6, 0.05, 0.4, matWood, -2.25 + 3.9, 0.8, 3.9 - 3.6);
        createBox(0.38, 0.14, 0.3, matFabric, -2.25 + 3.9, 0.9, 3.9 - 3.6);

        // Desk Reception & Cassa
        createBox(1.25, 1.05, 0.65, matFloor, -2.25 + 3.5, 0.52, -3.9 + 1.2);
        createBox(1.29, 0.04, 0.69, matWood, -2.25 + 3.5, 1.07, -3.9 + 1.2);
        createBox(0.25, 0.18, 0.15, matMetal, -2.25 + 3.7, 1.18, -3.9 + 1.2, 0.2, -0.4, 0);
        createBox(0.6, 0.45, 0.9, matFabric, -2.25 + 4.1, 0.22, -3.9 + 2.6);

        // Postazione Nails fronte vetrina
        createBox(1.2, 0.75, 0.55, matWood, -2.25 + 2.15, 0.37, -3.9 + 1.2);
        createBox(0.22, 0.01, 0.18, matMetal, -2.25 + 2.15, 0.755, -3.9 + 1.2);
        createBox(0.42, 0.75, 0.4, matSageFabric, -2.25 + 2.15, 0.37, -3.9 + 0.6);
        createBox(0.42, 0.75, 0.4, matFabric, -2.25 + 2.15, 0.37, -3.9 + 1.8);

        // Canaline e microfaretti architetturali
        createBox(0.04, 0.04, 6.2, matMetal, -0.5, 2.9, 0);
        createBox(0.04, 0.04, 6.2, matMetal, 1.2, 2.9, 0);
        for (let bz = -2.5; bz <= 2.5; bz += 1.25) {
            createBox(0.06, 0.12, 0.06, matMetal, -0.5, 2.82, bz);
            createBox(0.06, 0.12, 0.06, matMetal, 1.2, 2.82, bz);
        }

        // Setup viste
        function setView(view) {
            document.querySelectorAll('.btn-group button').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            if (view === 'iso') {
                camera.position.set(9, 9, -8);
                controls.target.set(0, 1.2, 0);
            } else if (view === 'top') {
                camera.position.set(0.01, 14, 0);
                controls.target.set(0, 0, 0);
            } else if (view === 'entrance') {
                camera.position.set(0.5, 1.7, -4.5);
                controls.target.set(0, 1.3, 0);
            } else if (view === 'cabin') {
                camera.position.set(1.5, 2.2, 1.8);
                controls.target.set(1.2, 1.0, 2.5);
            }
            controls.update();
        }

        camera.position.set(9, 8.5, -7.5);
        controls.target.set(0, 1.0, 0);
        controls.update();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
